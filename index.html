<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title> Dinh Nguyen Hoang Portfolio </title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    header img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
    }
    header p {
      font-size: 1.2em;
      margin-top: 10px;
    }
    section {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    section h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #444;
    }
    .apps {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .social {
      text-align: center;
      margin: 40px 0;
    }
    .social a {
      margin: 0 10px;
      text-decoration: none;
      color: #667eea;
      font-weight: 500;
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <img src="your-photo.jpg" alt="Ảnh cá nhân">
    <h1>Xin chào, tôi là Nguyen</h1>
    <p>Nhà phát triển ứng dụng Android</p>
  </header>

  <section>
    <h2>Ứng dụng của tôi</h2>
    <div class="apps">
      <div class="card">
        <img src="app1.png" alt="Ứng dụng 1">
        <h3>Tên ứng dụng 1</h3>
        <p>Mô tả ngắn gọn về ứng dụng.</p>
        <a href="#">Xem chi tiết</a>
      </div>
      <div class="card">
        <img src="app2.png" alt="Ứng dụng 2">
        <h3>Tên ứng dụng 2</h3>
        <p>Mô tả ngắn gọn về ứng dụng.</p>
        <a href="#">Xem chi tiết</a>
      </div>
    </div>
  </section>

  <section class="social">
    <h2>Kết nối với tôi</h2>
    <a href="https://www.linkedin.com/in/hoangdinhnguyen/" target="_blank">LinkedIn</a>
    <a href="https://www.facebook.com/ZenTakumie" target="_blank">GitHub</a>
    <a href="https://behance.net/zentakumi78" target="_blank">Twitter</a>
  </section>

  <footer>
    <p>Liên hệ: dinhnguyenhoang78@gmail.com</p>
  </footer>
</body>
</html>
